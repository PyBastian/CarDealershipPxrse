name: Actualizar Instagram

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:instagram
      - name: Guardar publicaciones nuevas
        run: |
          if [ -z "$(git status --porcelain -- public/instagram src/data/instagram.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram src/data/instagram.json
          git commit -m "content: sync Instagram"
          git push
